name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: benchmark/go.mod

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Test benchmark helpers
        run: python -m unittest discover -s benchmark/tests

      - name: Check Go formatting
        working-directory: benchmark
        run: test -z "$(gofmt -l .)"

      - name: Vet Go benchmark
        working-directory: benchmark
        run: go vet ./...

      - name: Test Go benchmark
        working-directory: benchmark
        run: go test ./...
